name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch (saves CI minutes on fast-push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: '${{ matrix.os }} / Node ${{ matrix.node }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' } # latest LTS on Linux
          - { os: windows-latest, node: '20' } # engines floor + Windows path coverage

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Raised from "any severity" on 2026-10-03: GHSA-vfj7-8cjw-p6xm (braces, reached through fast-glob)
      # has no fix yet and needs an attacker-controlled glob, but sigil only globs its own catalog.
      # Restore the default once braces is patched or fast-glob is replaced.
      - name: Audit dependencies (runtime deps, fail on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # build sets NODE_OPTIONS=--max-old-space-size=8192 via cross-env (see CLAUDE.md)
      - name: Build (TypeScript + schema emit)
        run: npm run build

      - name: Validate catalog
        run: npm run validate

      - name: Check template drift + catalog conformance + provider-doc staleness
        run: node dist-cli/cli.js sync --check

      - name: Run tests
        run: npm test

      - name: Build catalog output (claude + copilot)
        run: npm run catalog:build

      # Smoke-test the compiled CLI binary directly
      - name: CLI smoke test
        run: |
          node dist-cli/cli.js --version
          node dist-cli/cli.js list
