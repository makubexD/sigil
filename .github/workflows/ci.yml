name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch (saves CI minutes on fast-push)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: '${{ matrix.os }} / Node ${{ matrix.node }}'
    runs-on: ${{ matrix.os }}
    # A healthy run takes about 2 minutes. Without this a hung test holds the job for the 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' } # latest LTS on Linux
          - { os: windows-latest, node: '20' } # engines floor + Windows path coverage

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (runtime deps, fail on any severity)
        run: npm audit --omit=dev

      # Both only read files, so they run side by side (output is grouped per command, and a failure
      # in one does not hide the other's result). See scripts/run-parallel.cjs.
      - name: Lint and check formatting
        run: node scripts/run-parallel.cjs "npm run lint" "npm run format:check"

      # build sets NODE_OPTIONS=--max-old-space-size=8192 via cross-env (see CLAUDE.md)
      - name: Build (TypeScript + schema emit)
        run: npm run build

      - name: Validate catalog
        run: npm run validate

      - name: Check template drift + catalog conformance + provider-doc staleness
        run: node dist-cli/cli.js sync --check

      - name: Check skill eval coverage
        run: npm run evals:check

      # `test:built` skips the rebuild that `npm test` (pretest) would repeat right after the Build step.
      # Coverage is not enforced anywhere, and instrumenting every test process cost 13-16 s per job.
      # `npm test` on a developer machine still prints it.
      - name: Run tests
        run: npm run test:built
        env:
          SIGIL_TEST_COVERAGE: '0'

      - name: Build catalog output (claude + copilot)
        run: npm run catalog:build

      # Smoke-test the compiled CLI binary directly
      - name: CLI smoke test
        run: |
          node dist-cli/cli.js --version
          node dist-cli/cli.js list

  # Claude Code's own validator over the built plugins and marketplace (strict: warnings fail).
  # One Linux job beside the test matrix, so it adds no time to it. The CLI version is pinned, the
  # auto-updater and non-essential traffic are off, and the job uses no secrets: validation is local
  # and needs no login (see scripts/validate-claude-plugins.cjs).
  claude-plugins:
    name: Claude plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The version is pinned once, in package.json (config.claudeCodeVersion).
      - name: Install Claude Code CLI (pinned)
        run: |
          npm install --global "@anthropic-ai/claude-code@$(node -p "require('./package.json').config.claudeCodeVersion")"
          claude --version

      - name: Build and emit catalog output
        run: |
          npm run build
          npm run catalog:build

      - name: Validate Claude plugins and marketplace
        run: npm run validate:claude-plugins
