# Drift gate for the published Claude marketplace.
#
# After every Release run (any conclusion) and on demand, this checks that the `marketplace`
# branch equals a fresh `--target claude` build of the release its tip is tagged with
# (`marketplace-v<version>`). A tip without that tag fails, since only the release workflow
# tags it. A difference means a hand edit or a partial publish. Unreleased changes on
# `master` are not drift. Node is pinned to release.yml's version.
# See docs/decisions/publish-claude-marketplace-2026-10.md.

name: Marketplace drift

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve the published release and the marketplace branch
        id: resolve
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin marketplace > /dev/null; then
            echo "::notice::no marketplace branch yet; nothing to check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin marketplace:refs/remotes/origin/marketplace

          MTAG=$(git -c versionsort.suffix=- tag --points-at origin/marketplace --list "marketplace-v*.*.*" --sort=-v:refname | sed -n 1p)
          if [ -z "$MTAG" ]; then
            echo "::error::the marketplace branch tip carries no marketplace-v* tag; it was changed outside the release workflow"
            exit 1
          fi

          TAG="${MTAG#marketplace-}"
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "::error::$MTAG names release $TAG, which has no tag"
            exit 1
          fi

          git checkout --quiet "$TAG"
          git worktree add --detach "$RUNNER_TEMP/branch" origin/marketplace

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Checking marketplace against $TAG"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.resolve.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.resolve.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.resolve.outputs.skip != 'true'
        run: npm run build

      - name: Compare the marketplace branch with a fresh build
        if: steps.resolve.outputs.skip != 'true'
        run: npm run marketplace:check -- "$RUNNER_TEMP/branch"
