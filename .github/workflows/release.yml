name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  #
  # The same gate CI runs, on the tagged commit. `publish` and `marketplace` both wait on
  # this and nothing else, so the marketplace ships even before npm Trusted Publishing is set
  # up, and a failed npm publish never blocks it. `publish` also requires the repository
  # variable NPM_PUBLISH set to `true` and is skipped otherwise, so a release cut before npm
  # is set up still concludes green.
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release runs the same gate as CI (npm run ci:local): audit, lint, format, build,
      # validate, sync --check, tests, catalog build and Claude plugin validation, so a release
      # can never pass a narrower check than a pull request. The plugin validator needs the
      # Claude Code CLI, pinned once in package.json (config.claudeCodeVersion).
      - name: Install Claude Code CLI (pinned)
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          npm install --global "@anthropic-ai/claude-code@$(node -p "require('./package.json').config.claudeCodeVersion")"
          claude --version

      - name: Full CI gate
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: npm run ci:local

  publish:
    needs: gate
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest

    # id-token is required for npm OIDC Trusted Publishing (no stored NPM_TOKEN needed).
    # See: https://docs.npmjs.com/generating-provenance-statements
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The package's `prepack` script runs the build, so no separate build step is needed here.

      # ── Publish ──────────────────────────────────────────────────────────────
      #
      # RECOMMENDED PATH — npm OIDC Trusted Publishing (no stored secret):
      #   1. Publish once manually: `npm publish --access public`
      #   2. On npmjs.com → your package → Publishing → Trusted Publishers
      #      Add: repo=<owner>/<repo>, workflow=release.yml, environment=<leave blank>
      #   3. In GitHub → Settings → Secrets and variables → Actions → Variables, set
      #      NPM_PUBLISH = true. Until then this job is skipped, not failed.
      #   After that, OIDC authentication is automatic and this step runs as-is.
      #
      # FALLBACK (if OIDC cannot be configured):
      #   Replace the step below with:
      #     - name: Publish to npm (token)
      #       env:
      #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #       run: npm publish --access public
      #   Step 3 still applies: without NPM_PUBLISH = true this job never runs.
      #
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

  # ── Marketplace ────────────────────────────────────────────────────────────
  #
  # Runs after the gate passes, independent of npm publish, so the marketplace ships even
  # before npm Trusted Publishing is set up. It builds the tag's Claude marketplace and
  # publishes it to the orphan `marketplace` branch, which users add with
  # `/plugin marketplace add makubexD/sigil#marketplace`. Every publish is also
  # tagged `marketplace-v<version>` so a user can pin one. Only the newest `v*.*.*` tag
  # publishes, so a backport release never rolls users back, and a re-run of an
  # already published tag is a no-op. `contents: write` is granted on this job only —
  # the workflow-level permissions stay read-only.
  # See docs/decisions/publish-claude-marketplace-2026-10.md.
  #
  marketplace:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Two releases publish one after the other, never racing.
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the Claude marketplace
        run: node dist-cli/cli.js build --target claude --out-dir "$RUNNER_TEMP/mp"

      - name: Publish to the marketplace branch
        run: |
          set -euo pipefail

          BR="$RUNNER_TEMP/branch"
          TAG="marketplace-$GITHUB_REF_NAME"

          # Publish only from the newest release tag: a backport never rolls users back.
          LATEST=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin "v*.*.*" | sed -n 1p | sed 's|.*refs/tags/||')
          if [ "$GITHUB_REF_NAME" != "$LATEST" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest release ($LATEST); the marketplace stays on the newest one"
            exit 0
          fi

          # An already published tag is a no-op, so re-running a release is safe.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG is already published; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First publish has no `marketplace` branch yet: start an orphan one.
          if git ls-remote --exit-code --heads origin marketplace > /dev/null; then
            git fetch --depth=1 origin marketplace:refs/remotes/origin/marketplace
            git worktree add -B marketplace "$BR" origin/marketplace
          else
            git worktree add --orphan -b marketplace "$BR"
          fi

          # Keep `.git/`; replace everything else with the fresh build.
          find "$BR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/mp/claude/." "$BR/"

          cd "$BR"
          git add -A

          if git diff --cached --quiet; then
            echo "marketplace unchanged; tagging the existing commit"
          else
            git commit -m "marketplace: $GITHUB_REF_NAME"
          fi

          git tag "$TAG"
          git push --atomic origin marketplace "refs/tags/$TAG"
