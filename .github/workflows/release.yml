name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  #
  # The same gate CI runs, on the tagged commit. `publish`, `marketplace` and `skills` all
  # wait on this and nothing else, so the marketplace and skills branches ship even before npm
  # Trusted Publishing is set up, and a failed npm publish never blocks them. `publish` also
  # requires the repository variable NPM_PUBLISH set to `true` and is skipped otherwise, so a
  # release cut before npm is set up still concludes green.
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The release runs the same gate as CI (npm run ci:local): audit, lint, format, build,
      # validate, sync --check, tests, catalog build and Claude plugin validation, so a release
      # can never pass a narrower check than a pull request. The plugin validator needs the
      # Claude Code CLI, pinned once in package.json (config.claudeCodeVersion).
      - name: Install Claude Code CLI (pinned)
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          npm install --global "@anthropic-ai/claude-code@$(node -p "require('./package.json').config.claudeCodeVersion")"
          claude --version

      - name: Full CI gate
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: npm run ci:local

  publish:
    needs: gate
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest

    # id-token is required for npm OIDC Trusted Publishing (no stored NPM_TOKEN needed).
    # See: https://docs.npmjs.com/generating-provenance-statements
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The package's `prepack` script runs the build, so no separate build step is needed here.

      # ── Publish ──────────────────────────────────────────────────────────────
      #
      # RECOMMENDED PATH — npm OIDC Trusted Publishing (no stored secret):
      #   1. Publish once manually: `npm publish --access public`
      #   2. On npmjs.com → your package → Publishing → Trusted Publishers
      #      Add: repo=<owner>/<repo>, workflow=release.yml, environment=<leave blank>
      #   3. In GitHub → Settings → Secrets and variables → Actions → Variables, set
      #      NPM_PUBLISH = true. Until then this job is skipped, not failed.
      #   After that, OIDC authentication is automatic and this step runs as-is.
      #
      # FALLBACK (if OIDC cannot be configured):
      #   Replace the step below with:
      #     - name: Publish to npm (token)
      #       env:
      #         NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #       run: npm publish --access public
      #   Step 3 still applies: without NPM_PUBLISH = true this job never runs.
      #
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public

  # ── Marketplace ────────────────────────────────────────────────────────────
  #
  # Runs after the gate passes, independent of npm publish, so the marketplace ships even
  # before npm Trusted Publishing is set up. It builds the tag's Claude marketplace and
  # publishes it to the orphan `marketplace` branch, which users add with
  # `/plugin marketplace add makubexD/sigil#marketplace`. Every publish is also
  # tagged `marketplace-v<version>` so a user can pin one. Only the newest `v*.*.*` tag
  # publishes, so a backport release never rolls users back, and a re-run of an
  # already published tag is a no-op. `contents: write` is granted on this job only —
  # the workflow-level permissions stay read-only.
  # See docs/decisions/publish-claude-marketplace-2026-10.md.
  #
  marketplace:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Two releases publish one after the other, never racing.
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the Claude marketplace
        run: node dist-cli/cli.js build --target claude --out-dir "$RUNNER_TEMP/mp"

      - name: Publish to the marketplace branch
        run: bash scripts/publish-branch.sh marketplace marketplace- "$RUNNER_TEMP/mp/claude"

  # ── Agent Skills ───────────────────────────────────────────────────────────
  #
  # Runs after the gate passes, independent of npm publish, so the skills branch ships even
  # before npm Trusted Publishing is set up. It builds the tag's agents-standard tree without
  # its root AGENTS.md and publishes it to the orphan `skills` branch, which users install
  # from with `npx skills add https://github.com/makubexD/sigil/tree/skills --skill <name>`.
  # Every publish is also tagged `skills-v<version>` so a user can pin one. Only the newest
  # `v*.*.*` tag publishes, so a backport release never rolls users back, and a re-run of an
  # already published tag is a no-op — both in scripts/publish-branch.sh. `contents: write`
  # is granted on this job only — the workflow-level permissions stay read-only.
  # See docs/decisions/distribution-channels-2026-09.md (§ 6, Phase 3).
  #
  skills:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Two releases publish one after the other, never racing.
    concurrency:
      group: skills-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build the Agent Skills tree
        run: |
          node dist-cli/cli.js build --target agents-standard --out-dir "$RUNNER_TEMP/sk"
          # Repo-wide rules belong to `sigil add`, not to `npx skills`.
          rm "$RUNNER_TEMP/sk/agents-standard/AGENTS.md"

      - name: Publish to the skills branch
        run: bash scripts/publish-branch.sh skills skills- "$RUNNER_TEMP/sk/agents-standard"
