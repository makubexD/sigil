# The catalog standard as data (docs/decisions/family-skeleton-standard-2026-10.md).
#
# stacks:   the ecosystems a shared skill may carry `references/stack-<id>.md` for. A language
#           names its stack in its language.yaml (`stack:`); go and rust are stacks with no language.
# families: every language agent, rule and skill belongs to exactly one family. A family lists its
#           members explicitly (ids never change to fit a name), and may declare `sections` (the H2
#           skeleton every member has, in order; step numbers are ignored) and `keys` (frontmatter
#           every member sets). `absent` records why a language has no member.
# severities: the one scale every report template grades findings on, highest first. A tier heading
#           (`#### Major`, `#### Low / Informational`) off this scale fails catalog-layout.
#
# Checked by `sigil sync --check` (family-skeleton, catalog-layout, catalog-symmetry). Author-only:
# consumer commands never read this file.

stacks:
  - id: dotnet
    displayName: .NET
  - id: go
    displayName: Go
  - id: node-ts
    displayName: Node.js / TypeScript
  - id: python
    displayName: Python
  - id: rust
    displayName: Rust

severities: [Critical, High, Medium, Low]

families:
  # ── Agents ──────────────────────────────────────────────────────────────────────────────────
  - id: api-compat-reviewer
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Determine the public surface"
      - "Diff against the previous release"
      - "Classify each change"
      - "Check deprecation discipline"
      - "Output"
    members:
      - angular/ng-api-compat-reviewer
      - csharp/cs-api-compat-reviewer
      - python/py-api-compat-reviewer
      - react/react-api-compat-reviewer
      - typescript/ts-api-compat-reviewer
  - id: architecture-reviewer
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Determine scope"
      - "Discover architecture intent"
      - "Build the dependency graph"
      - "Review dimensions"
      - "Output"
      - "Design mode"
    members:
      - angular/ng-architecture-reviewer
      - csharp/cs-architecture-reviewer
      - python/py-architecture-reviewer
      - react/react-architecture-reviewer
      - typescript/ts-architecture-reviewer
  - id: code-reviewer
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Determine scope"
      - "Discover conventions"
      - "Review dimensions"
      - "Run the quality gate (read-only)"
      - "Output"
    members:
      - angular/ng-code-reviewer
      - csharp/cs-code-reviewer
      - python/py-code-reviewer
      - react/react-code-reviewer
      - typescript/ts-code-reviewer
  - id: debugger
    kind: agent
    keys: [tools]
    sections: [Reproduce, Isolate, Fix, Verify, Output]
    members:
      - angular/ng-debugger
      - csharp/cs-debugger
      - python/py-debugger
      - react/react-debugger
      - typescript/ts-debugger
  - id: performance-profiler
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Determine scope"
      - "Discover context"
      - "Static analysis — complexity and anti-patterns"
      - "Dynamic profiling (if runnable)"
      - "Output"
    members:
      - angular/ng-performance-profiler
      - csharp/cs-performance-profiler
      - python/py-performance-profiler
      - react/react-performance-profiler
      - typescript/ts-performance-profiler
  - id: refactor-specialist
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Establish baseline"
      - "Identify and plan the refactor"
      - "Apply refactors — one step at a time"
      - "Verify"
      - "Output"
    members:
      - angular/ng-refactor-specialist
      - csharp/cs-refactor-specialist
      - python/py-refactor-specialist
      - react/react-refactor-specialist
      - typescript/ts-refactor-specialist
  - id: security-auditor
    kind: agent
    keys: [tools, relatedArtifacts]
    sections:
      - "Determine scope"
      - "Discover conventions and security baseline"
      - "Audit dimensions (sweep each systematically)"
      - "Run available security tooling (read-only)"
      - "Output"
    members:
      - angular/ng-security-auditor
      - csharp/cs-security-auditor
      - python/py-security-auditor
      - react/react-security-auditor
      - typescript/ts-security-auditor
  - id: template-reviewer
