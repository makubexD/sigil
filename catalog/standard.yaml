  # ── Shared ──────────────────────────────────────────────────────────────────────────────────
  # Design skills whose stack the task chooses: steps in SKILL.md, detail and one file per stack
  # in references/ (docs/decisions/catalog-layout-standard-2026-10.md, case c).
  - id: stack-skill
    kind: skill
    keys: [whenToUse, relatedArtifacts]
    sections:
      - Decide the engagement
      - design
      - build
      - audit
      - refactor
      - Stacks
      - Gates
    references:
      stacks: true
      files: { architecture: core, auditor: brief, contract: core, findings: core, testing: core }
