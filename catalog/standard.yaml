# The catalog standard as data (docs/decisions/family-skeleton-standard-2026-10.md).
#
# stacks:   the ecosystems a shared skill has stack parts for. A language names its stack in its
#           language.yaml (`stack:`); `home` is the one language whose folder holds the stack's
#           text (languages/<home>/stack-parts/<skill>.md): shared/ holds only neutral text.
# families: every agent, rule and skill belongs to exactly one family (shared ones too). A family lists its
#           members explicitly (ids never change to fit a name), and may declare `sections` (the H2
#           skeleton every member has, in order; step numbers are ignored) and `keys` (frontmatter
#           every member sets, exactly). `absent` records why a language has no member. `title`
#           makes a language member's title `<title> (<language displayName>)`. `references`
#           lists the reference files members carry, by role (core: detail read on demand,
#           brief: an agent's hand-off, examples); `stacks: true` wants one stack-<id>.md per
#           declared stack, all with one H2 skeleton. No `references` = SKILL.md only.
#           Members load rules and agents from the same families (`uses`).
# bases:    shared rules other rules extend; a base belongs to no family.
# severities: the one scale every report template grades findings on, highest first. A tier heading
#           (`#### Major`, `#### Low / Informational`) off this scale fails catalog-layout.
#
# Checked by `sigil sync --check` (family-skeleton, catalog-layout, catalog-symmetry). Author-only:
# consumer commands never read this file.

stacks:
  - id: dotnet
    displayName: .NET
    home: csharp
  - id: go
    displayName: Go
    home: go
  - id: node-ts
    displayName: Node.js / TypeScript
    home: typescript
  - id: python
    displayName: Python
    home: python
  - id: rust
    displayName: Rust
    home: rust

severities: [Critical, High, Medium, Low]

bases: [shared/clean-code, shared/git]

families:
