# packs.yaml — curated artifact bundles for `sigil add`.
#
# Packs can mix any artifact kind (MCPs, hooks, settings, prompts, skills, agents, rules).
# List artifact IDs explicitly under `artifacts:` using bare IDs — no kind: prefix.
# When a pack contains skills, their rule / agent dependencies are auto-resolved by
# the wizard's `deps` step; you do not need to list them manually here.
#
# Legacy: use `languages: [<lang>]` to include every artifact for a language.
# Prefer explicit `artifacts:` lists for curated packs (takes precedence over languages).
# `pluginExclude: [<id>]` keeps a listed artifact out of the Claude plugin; sigil add still installs it.
#
# Add a new pack by appending an entry here — no catalog or adapter changes needed.
#
# A fork names its marketplace with a top-level `marketplace:` block (absent here, so the build
# emits sigil's own identity): docs/guides/publishing.md#name-your-marketplace.

packs:
  - name: essentials
    displayName: Essentials (any language)
    description: >
      Explain a diff for any audience, in any programming language.
      With sigil add, also installs the Filesystem MCP, config-file protection,
      and a command that authors new catalog artifacts.
      Dev-tool permissions are per language: each starter pack carries its own.
    artifacts:
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - shared/explain-diff
      - shared/author-artifact
    # Needs the sigil CLI and a catalog, which a plugin-only user lacks; returns at npm publish.
    pluginExclude: [shared/author-artifact]

  - name: dotnet-starter
    displayName: .NET / C# Starter
    description: >
      Complete setup for .NET / C# development.
      Includes the cs-generate-tests skill (plus its C# testing rule and the
      cs-code-reviewer agent as automatically resolved deps), the
      Filesystem MCP, config-file protection, and common dev-tool permissions.
    artifacts:
      - csharp/cs-generate-tests
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - csharp/cs-allow-dev-tools

  - name: python-starter
    displayName: Python Starter
    description: >
      Complete setup for Python development.
      Includes the py-generate-tests skill (plus its Python testing rule and the
      py-code-reviewer agent as automatically resolved deps), the
      Filesystem MCP, config-file protection, and common dev-tool permissions.
    artifacts:
      - python/py-generate-tests
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - python/py-allow-dev-tools

  - name: react-starter
    displayName: React Starter
    description: >
      Complete setup for React development.
      Includes the react-generate-tests skill (plus its React testing rule and the
      react-code-reviewer agent as automatically resolved deps), the
      Filesystem MCP, config-file protection, and common dev-tool permissions.
    artifacts:
      - react/react-generate-tests
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - react/react-allow-dev-tools

  - name: dotnet-tooling
    displayName: .NET / C# Tooling
    languages: [csharp]
    description: >
      Full .NET / C# tooling suite — all imported cs- skills, agents, and rules.
      Skills include scaffolding, testing, documentation, dependency management,
      security auditing, release preparation, and package vetting.
      Skill deps (rules + agents) are auto-resolved by the wizard's deps step.

  - name: typescript-starter
    displayName: TypeScript Starter
    description: >
      Complete setup for TypeScript development.
      Includes generate-tests, document, and release skills plus their deps,
      the Filesystem MCP, config-file protection, and common dev-tool permissions.
    artifacts:
      - typescript/ts-generate-tests
      - typescript/ts-document
      - typescript/ts-release
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - typescript/ts-allow-dev-tools

  - name: typescript-tooling
    displayName: TypeScript Tooling
    languages: [typescript]
    description: >
      Full TypeScript tooling suite — all imported ts- skills, agents, and rules.
      Skills include testing, scaffolding, documentation, dependency management,
      security auditing, and release preparation.
      Skill deps are auto-resolved by the wizard's deps step.

  - name: angular-starter
    displayName: Angular Starter
    description: >
      Complete setup for Angular development.
      Includes generate-tests and generate-component skills plus their deps,
      the Filesystem MCP, config-file protection, and common dev-tool permissions.
    artifacts:
      - angular/ng-generate-tests
      - angular/ng-generate-component
      - shared/filesystem
      - shared/protect-config
      - shared/reviewer-bash-guard
      - angular/ng-allow-dev-tools

  - name: angular-tooling
    displayName: Angular Tooling
    languages: [angular]
    description: >
      Full Angular tooling suite — all imported ng- skills, agents, and rules.
      Covers Angular-specific concerns: components, RxJS, Signals, templates,
      security, and testing patterns for Angular applications.
      Skill deps are auto-resolved by the wizard's deps step.

  - name: python-tooling
    displayName: Python Tooling
    languages: [python]
    description: >
      Full Python tooling suite — all py- skills, agents, and rules.
      Skills include scaffolding, testing, documentation, dependency management,
      security auditing, and release preparation.
      Skill deps are auto-resolved by the wizard's deps step.

  - name: react-tooling
    displayName: React Tooling
    languages: [react]
    description: >
      Full React tooling suite — all react- skills, agents, and rules.
      Skills include scaffolding, testing, documentation, dependency management,
      security auditing, and release preparation.
      Skill deps are auto-resolved by the wizard's deps step.

  - name: spec-driven
    displayName: Spec-Driven Development
    description: >
      The /feature conductor: drives one feature through clarify, spec, plan, TDD build,
      review and close-out with explicit approval gates. Requires the agent-skills collection
      (addyosmani/agent-skills), installed separately. Works with any language.
    artifacts:
      - shared/feature

  - name: cli-builder
    displayName: CLI Builder
    description: >
      Design, build, audit, or refactor a command-line interface and the setup wizard layered over
      it. Includes the cli and wizard skills (with per-stack guidance for Node/TypeScript, Python,
      Go, Rust and .NET), their CLI and wizard rules, and the two auditor agents as automatically
      resolved deps. Works with any language.
    artifacts:
      - shared/cli
      - shared/wizard

  - name: deepseek-worker
    displayName: DeepSeek Worker (headless Claude Code delegation)
    description: >
      Plan and review in the main session, and hand mechanical coding steps to a headless Claude
      Code run on the paid DeepSeek API (mk-exec), with its own config dir, effort low, medium or
      high, and a full log per run. Includes /mk-delegate, /mk-check (which installs mk-exec,
      workflow-report and the worker config from its references), the orchestration rule as a
      resolved dep, and the worker-mode guard hook (installs with sigil add; plugins can't carry
      hooks yet). Requires Claude Code and a DeepSeek API key. Works with any language.
    artifacts:
      - shared/mk-delegate
      - shared/mk-check
      - shared/worker-mode-guard
    pluginDependencies: [shared/worker-mode-guard]
